```html
<!DOCTYPE html>
<html>

<head>

<title>Customer Feedback</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:420px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.logo{
    font-size:50px;
    margin-bottom:10px;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

.stars{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:20px 0;
}

.stars span{
    font-size:48px;
    cursor:pointer;
    color:#ccc;
    transition:all .2s;
    user-select:none;
}

.stars span:hover{
    transform:scale(1.15);
}

#ratingText{
    color:#666;
    margin-bottom:20px;
    min-height:22px;
    font-weight:bold;
}

textarea{
    width:100%;
    height:120px;
    border-radius:12px;
    border:1px solid #ddd;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
    resize:none;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    background:#111827;
    color:white;
    border:none;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

button:disabled{
    background:#888;
    cursor:not-allowed;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🏪
</div>

<h2>Quick Shop</h2>

<h1>How was your visit?</h1>

<p class="subtitle">
Your feedback helps us serve you better.
</p>

<div class="stars">

<span onclick="setRating(1)">☆</span>
<span onclick="setRating(2)">☆</span>
<span onclick="setRating(3)">☆</span>
<span onclick="setRating(4)">☆</span>
<span onclick="setRating(5)">☆</span>

</div>

<p id="ratingText">
Tap a star to rate us
</p>

<input
type="hidden"
id="rating"
value="0"
>

<textarea
id="comment"
placeholder="Tell us about your experience (optional)..."
></textarea>

<button onclick="submitFeedback()">
Submit Feedback
</button>

</div>

<script>

function setRating(rating){

    document.getElementById("rating").value = rating;

    const stars = document.querySelectorAll(".stars span");

    stars.forEach((star,index)=>{

        if(index < rating){

            star.innerHTML="★";
            star.style.color="#fbbf24";

        }else{

            star.innerHTML="☆";
            star.style.color="#ccc";

        }

    });

    const messages = [
        "",
        "Poor 😞",
        "Fair 🙂",
        "Good 😊",
        "Very Good 😃",
        "Excellent 🤩"
    ];

    document.getElementById("ratingText").innerText = messages[rating];

}

async function submitFeedback(){

    const rating = document.getElementById("rating").value;
    const comment = document.getElementById("comment").value.trim();

    if(rating == 0){

        alert("Please select a rating.");

        return;

    }

    const button = document.querySelector("button");

    button.disabled = true;
    button.innerText = "Submitting...";

    try{

        const response = await fetch("/feedback",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                rating:Number(rating),
                comment:comment

            })

        });

        if(response.ok){

            document.querySelector(".container").innerHTML = `

            <div style="padding:40px 20px;">

                <div style="font-size:75px;">✅</div>

                <h1>Thank You!</h1>

                <p style="color:#555;font-size:18px;">
                    Your feedback has been submitted successfully.
                </p>

                <p style="margin-top:20px;color:#888;">
                    We truly appreciate your time.
                </p>

                <h3 style="margin-top:35px;">
                    Have a wonderful day! 😊
                </h3>

            </div>

            `;

        }else{

            throw new Error();

        }

    }catch(error){

        button.disabled = false;
        button.innerText = "Submit Feedback";

        alert("Something went wrong. Please try again.");

    }

}

</script>

</body>

</html>
