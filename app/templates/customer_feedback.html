<!DOCTYPE html>
<html>

<head>

<title>Customer Feedback</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body {

    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 20px;

}


.container {

    max-width: 420px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);

}


.logo {

    font-size: 45px;
    margin-bottom: 10px;

}


h1 {

    font-size: 24px;
    margin-bottom: 5px;

}


.subtitle {

    color: #666;
    margin-bottom: 25px;

}



.stars {

    display:flex;
    justify-content:center;
    gap:8px;
    margin:20px 0;

}


.stars span {

    font-size:42px;
    cursor:pointer;
    color:#ccc;

}


.stars span:hover {

    transform:scale(1.1);

}



textarea {

    width:100%;
    height:120px;
    border-radius:12px;
    border:1px solid #ddd;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
    resize:none;

}



button {

    margin-top:20px;
    width:100%;
    padding:15px;
    background:#111827;
    color:white;
    border:none;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;

}



button:hover {

    opacity:0.9;

}



.success {

    display:none;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
🏪
</div>

<h2>
Quick Shop
</h2>

<h1>
How was your visit?
</h1>


<p class="subtitle">
Your feedback helps us serve you better
</p>



<div class="stars">

<span onclick="setRating(1)">☆</span>
<span onclick="setRating(2)">☆</span>
<span onclick="setRating(3)">☆</span>
<span onclick="setRating(4)">☆</span>
<span onclick="setRating(5)">☆</span>

</div>


<input 
type="hidden"
id="rating"
value="0"
>


<textarea
id="comment"
placeholder="Tell us about your experience..."
></textarea>



<button onclick="submitFeedback()">

Submit Feedback

</button>


<div class="success">

<h2>
Thank you! 🙏
</h2>

<p>
We appreciate your feedback.
</p>

</div>


</div>



<script>


function setRating(rating){

document.getElementById("rating").value = rating;


let stars=document.querySelectorAll(".stars span");


stars.forEach((star,index)=>{

if(index < rating){

star.innerHTML="★";
star.style.color="#fbbf24";

}

else{

star.innerHTML="☆";
star.style.color="#ccc";

}


});


}



async function submitFeedback(){


let rating=document.getElementById("rating").value;

let comment=document.getElementById("comment").value;


if(rating == 0){

alert("Please select a rating");

return;

}



let response = await fetch("/feedback",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

rating:Number(rating),

comment:comment

})


});


if(response.ok){

document.querySelector(".container").innerHTML=`

<h2>Thank you! 🙏</h2>

<p>
Your feedback means a lot to us.
</p>

`;

}

else{

alert("Something went wrong");

}


}



</script>


</body>

</html>
